<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autonomous Office Multi-Agent Simulation Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #090d16;
      color: #f8fafc;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    header {
      width: 100%;
      max-width: 1400px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 16px 24px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
      background: #0f172a;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .tab-btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #7e22ce;
      color: #ffffff;
    }
    .container {
      width: 100%;
      max-width: 1400px;
      height: 820px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #334155;
      background-color: #0f172a;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>🏢 Autonomous Agent Office Activity Simulation Hub</h1>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchView('phaser')">⚡ Phaser 3 Engine (Recommended)</button>
      <button class="tab-btn" onclick="switchView('canvas')">🏃 Canvas2D Prototype</button>
      <button class="tab-btn" onclick="switchView('svg')">📐 SVG Blueprint</button>
    </div>
  </header>

  <div class="container">
    <iframe id="mainFrame" src="./office_phaser_sim.html"></iframe>
  </div>

  <script>
    function switchView(view) {
      const frame = document.getElementById('mainFrame');
      const btns = document.querySelectorAll('.tab-btn');
      
      btns.forEach(b => b.classList.remove('active'));
      
      if (view === 'phaser') {
        frame.src = './office_phaser_sim.html';
        btns[0].classList.add('active');
      } else if (view === 'canvas') {
        frame.src = './office_simulation.html';
        btns[1].classList.add('active');
      } else {
        frame.src = './office_plan_updated.svg';
        btns[2].classList.add('active');
      }
    }
  </script>
</body>
</html>
