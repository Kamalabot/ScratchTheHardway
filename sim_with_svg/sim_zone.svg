<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="297mm"
   height="210mm"
   viewBox="0 0 297 210"
   version="1.1"
   id="svg-sim-zone"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns:xlink="http://www.w3.org/1999/xlink">

  <defs id="defs-sim-zone">
    <!-- Multi-stage Bloom & Glow Filter -->
    <filter id="cyber-bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="7.0" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Ambient Glow -->
    <filter id="hud-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.0" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Energy Radial Gradient -->
    <linearGradient id="linearGradient13">
      <stop style="stop-color:#f3ff00;stop-opacity:1;" offset="0" id="stop13" />
      <stop style="stop-color:#c3c493;stop-opacity:0.447;" offset="1" id="stop14" />
    </linearGradient>

    <radialGradient
       xlink:href="#linearGradient13"
       id="radialGradient14"
       cx="43.404568"
       cy="57.062038"
       fx="43.404568"
       fy="57.062038"
       r="20.579754"
       gradientTransform="matrix(1,0,0,0.97272718,0,1.5562425)"
       gradientUnits="userSpaceOnUse" />

    <clipPath clipPathUnits="userSpaceOnUse" id="clipPathLeftPylon">
      <rect width="16.98221" height="133.216" x="34.341805" y="38.115627" />
    </clipPath>

    <clipPath clipPathUnits="userSpaceOnUse" id="clipPathRightPylon">
      <rect width="16.98221" height="133.216" x="34.341805" y="38.115627" />
    </clipPath>
  </defs>

  <style id="style-sim-zone">
    :root {
      --bg-color: #009bff;
      --conduit-color: #ffffff;
      --housing-color: #ffcc00;
      --node-inactive: #decd87;
      --node-active: #fff5a8;
      --capacitor-color: #ffcc00;
      --coolant-color: #88aa00;
    }

    /* Standalone CSS Animations */
    .energy-conduit {
      stroke: var(--conduit-color);
      stroke-width: 0.8;
      stroke-linecap: round;
      stroke-dasharray: 6 4;
      opacity: 0.4;
      animation: conduit-flow 2s linear infinite;
    }

    #center-generator-core {
      transform-box: fill-box;
      transform-origin: center;
      animation: core-rotate 10s linear infinite;
      filter: url(#cyber-bloom);
    }

    #center-energy-halo {
      transform-box: fill-box;
      transform-origin: center;
      animation: halo-pulse 3s ease-in-out infinite alternate;
    }

    .pylon-emitter-node {
      transition: fill 0.3s ease, filter 0.3s ease;
      animation: node-breathing 3s ease-in-out infinite alternate;
    }

    #node-left-1, #node-right-1 { animation-delay: 0s; }
    #node-left-2, #node-right-2 { animation-delay: 0.4s; }
    #node-left-3, #node-right-3 { animation-delay: 0.8s; }

    #capacitor-core {
      animation: capacitor-charge 4s ease-in-out infinite alternate;
    }

    #coolant-core {
      animation: coolant-pulse 5s ease-in-out infinite alternate;
    }

    /* Keyframes */
    @keyframes conduit-flow {
      from { stroke-dashoffset: 20; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes core-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes halo-pulse {
      0% { opacity: 0.3; transform: scale(0.95); }
      100% { opacity: 0.8; transform: scale(1.1); filter: url(#cyber-bloom); }
    }

    @keyframes node-breathing {
      0% { fill: var(--node-inactive); filter: none; }
      100% { fill: var(--node-active); filter: url(#cyber-bloom); }
    }

    @keyframes capacitor-charge {
      0% { fill: var(--capacitor-color); filter: none; }
      100% { fill: #ffe875; filter: url(#cyber-bloom); }
    }

    @keyframes coolant-pulse {
      0% { fill: var(--coolant-color); opacity: 0.8; }
      100% { fill: #aacc11; opacity: 1; filter: url(#hud-glow); }
    }
  </style>

  <!-- LAYER 1: Background Grid -->
  <g id="layer-background">
    <rect id="bg-rect" width="297" height="210" x="0" y="0" fill="var(--bg-color)" />
  </g>

  <!-- LAYER 2: Circuit Energy Conduits -->
  <g id="layer-conduits">
    <!-- Conduits from Center Generator (approx 148, 105) to System Elements -->
    <path class="energy-conduit" d="M 148.5,105 L 42.7,55" />
    <path class="energy-conduit" d="M 148.5,105 L 42.7,105" />
    <path class="energy-conduit" d="M 148.5,105 L 42.7,152" />
    <path class="energy-conduit" d="M 148.5,105 L 233.7,55" />
    <path class="energy-conduit" d="M 148.5,105 L 233.7,105" />
    <path class="energy-conduit" d="M 148.5,105 L 233.7,152" />
    <path class="energy-conduit" d="M 148.5,105 L 272,25" />
    <path class="energy-conduit" d="M 148.5,105 L 269,184" />
  </g>

  <!-- LAYER 3: Telemetry HUD Box (Top Left) -->
  <g id="layer-hud">
    <rect id="hud-telemetry-box" width="58.44" height="22.59" x="9.83" y="6.06" fill="none" stroke="#000000" stroke-width="0.8" />
  </g>

  <!-- LAYER 4: High Voltage Capacitor Unit (Top Right) -->
  <g id="layer-capacitor">
    <rect id="capacitor-core" width="44.53" height="43.02" x="249.82" y="3.77" fill="var(--capacitor-color)" />
  </g>

  <!-- LAYER 5: Coolant Grounding Unit (Bottom Right) -->
  <g id="layer-coolant">
    <rect id="coolant-core" width="44.90" height="46.04" x="246.80" y="161.14" fill="var(--coolant-color)" />
  </g>

  <!-- LAYER 6: Left Light Pylon -->
  <g id="layer-pylon-left">
    <!-- Light Emitter Nodes -->
    <rect id="node-left-1" class="pylon-emitter-node pylon-left-node" width="6.79" height="27.54" x="39.31" y="41.13" fill="var(--node-inactive)" />
    <rect id="node-left-2" class="pylon-emitter-node pylon-left-node" width="6.79" height="27.54" x="39.31" y="91.03" fill="var(--node-inactive)" />
    <rect id="node-left-3" class="pylon-emitter-node pylon-left-node" width="6.79" height="27.54" x="39.31" y="138.34" fill="var(--node-inactive)" />
    
    <!-- Outer Structural Enclosure -->
    <g id="pylon-left-enclosure">
      <rect id="pylon-left-border" width="16.98" height="133.21" x="34.34" y="38.11" fill="none" stroke="#ffffff" stroke-width="0.75" />
    </g>
  </g>

  <!-- LAYER 7: Right Light Pylon -->
  <g id="layer-pylon-right">
    <!-- Light Emitter Nodes -->
    <rect id="node-right-1" class="pylon-emitter-node pylon-right-node" width="6.79" height="27.54" x="230.38" y="41.33" fill="var(--node-inactive)" />
    <rect id="node-right-2" class="pylon-emitter-node pylon-right-node" width="6.79" height="27.54" x="230.38" y="91.24" fill="var(--node-inactive)" />
    <rect id="node-right-3" class="pylon-emitter-node pylon-right-node" width="6.79" height="27.54" x="230.38" y="138.54" fill="var(--node-inactive)" />
    
    <!-- Outer Structural Enclosure -->
    <g id="pylon-right-enclosure">
      <rect id="pylon-right-border" width="16.98" height="133.21" x="225.04" y="38.11" fill="none" stroke="#ffffff" stroke-width="0.75" />
    </g>
  </g>

  <!-- LAYER 8: Center Generator Station -->
  <g id="layer-center-generator">
    <!-- Housing Box -->
    <rect id="center-generator-housing" width="44.53" height="43.02" x="126.23" y="83.48" rx="2.58" ry="3.51" fill="var(--housing-color)" />
    
    <!-- Rotating Star Generator Core -->
    <path
       id="center-generator-core"
       d="m 149.53781,104.27078 c -1.64292,1.25004 -2.45779,11.82915 -4.50562,12.09026 -2.04782,0.26111 -5.49128,-9.77503 -7.39531,-10.57281 -1.90402,-0.79779 -11.47324,3.78607 -12.72328,2.14316 -1.25004,-1.64292 5.71978,-9.643116 5.45867,-11.69094 -0.26111,-2.047823 -9.01545,-8.043083 -8.21767,-9.947106 0.79778,-1.904024 11.21107,0.13192 12.85398,-1.118121 1.64291,-1.250041 2.45779,-11.829153 4.50561,-12.090265 2.04783,-0.261112 5.49129,9.775032 7.39531,10.572814 1.90403,0.797782 11.47325,-3.78607 12.72329,-2.143158 1.25004,1.642911 -5.71978,9.643111 -5.45867,11.690935 0.26111,2.047823 9.01545,8.043081 8.21767,9.947111 -0.79778,1.90402 -11.21107,-0.13192 -12.85398,1.11812 z"
       fill="#ac9393"
       stroke="#ffffff"
       stroke-width="0.75"
       transform="matrix(0.87901814,0,0,0.83266953,23.252204,25.939954)" />

    <!-- Ambient Energy Halo -->
    <path
       id="center-energy-halo"
       style="opacity:0.6;fill:url(#radialGradient14);"
       d="M 63.984322,57.062038 A 20.579754,20.018486 0 0 1 43.558882,77.079962 20.579754,20.018486 0 0 1 22.827128,57.362241 20.579754,20.018486 0 0 1 42.941659,37.048617 20.579754,20.018486 0 0 1 63.975065,56.4617" />
  </g>
</svg>
