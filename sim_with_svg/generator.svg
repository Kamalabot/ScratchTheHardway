   id="svg-generator"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  
  <defs id="defs-generator">
    <!-- Scalable Core Glow Filter -->
    <filter id="core-glow-filter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur1" />
      <feGaussianBlur stdDeviation="3.0" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="spark-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="60%" stop-color="#fff5a8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffcc00" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style id="style-generator">
    :root {
      --housing-fill: #ffcc00;
      --core-fill: #ac9393;
      --core-stroke: #ffffff;
      --spark-color: #fff5a8;
      --spin-speed: 12s;
    }

    #generator-housing {
      fill: var(--housing-fill);
      fill-opacity: 1;
      stroke-width: 0.25;
      stroke-linecap: round;
      stroke-opacity: 0.94;
      animation: housing-pulse 4s ease-in-out infinite alternate;
    }

    #generator-core {
      fill: var(--core-fill);
      fill-opacity: 1;
      stroke: var(--core-stroke);
      stroke-width: 0.75;
      stroke-linecap: round;
      stroke-opacity: 0.94;
      transform-box: fill-box;
      transform-origin: center;
      animation: spin-core var(--spin-speed) linear infinite;
      filter: url(#core-glow-filter);
    }

    #generator-spark {
      fill: url(#spark-glow);
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse-spark 2s ease-in-out infinite alternate;
    }

    @keyframes spin-core {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes housing-pulse {
      0% { filter: drop-shadow(0 0 1px rgba(255, 204, 0, 0.4)); }
      100% { filter: drop-shadow(0 0 4px rgba(255, 204, 0, 0.8)); }
    }

    @keyframes pulse-spark {
      0% { transform: scale(0.85); opacity: 0.5; }
      100% { transform: scale(1.25); opacity: 1; }
    }
  </style>

  <g id="generator-layer" transform="translate(-126.23446,-83.489195)">
    <!-- Generator Outer Housing -->
    <path
