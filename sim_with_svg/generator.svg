       class="gen-part"
       d="m 128.82194,83.489197 h 39.356 c 1.43348,0 2.5875,1.567039 2.5875,3.513541 v 35.994522 c 0,1.53527 -0.71792,2.83448 -1.72463,3.31491 -0.44133,0.21062 -1.26263,0.19863 -1.75576,0.19863 h -38.46311 c -1.43347,0 -2.5875,-1.56704 -2.5875,-3.51354 V 87.002738 c 0,-1.946502 1.15403,-3.513541 2.5875,-3.513541 z" />

