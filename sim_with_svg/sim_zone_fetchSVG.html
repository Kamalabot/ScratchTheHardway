<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enforced Native SVG Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #030a16;
            color: white;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #controls {
            padding: 12px;
            background: #08162d;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
            border-bottom: 1px solid #00d2ff;
        }
        button {
            padding: 8px 18px;
            cursor: pointer;
            background: rgba(4, 20, 44, 0.85);
            color: #00d2ff;
            border: 1px solid #00d2ff;
            font-family: monospace;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        button:hover { 
            background: #00d2ff;
            color: #04142c;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.6);
        }
        #svg-container {
            width: 90vw;
            height: 80vh;
            margin-top: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border-radius: 8px;
            overflow: hidden;
        }
        svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="controls">
        <button id="btnStart">Start System</button>
        <button id="btnStop">Halt System</button>
        <button id="btnAdd">Add Pillar</button>
        <button id="btnRemove">Remove Pillar</button>
    </div>

    <div id="svg-container"></div>

    <script>
        (async function init() {
            try {
                console.log("Fetching structured SVG asset...");
                const response = await fetch('sim_zone.svg');
                if (!response.ok) throw new Error("HTTP error: " + response.status);
                
                const svgText = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(svgText, "image/svg+xml");
                const svg = doc.querySelector('svg');
                
                const container = document.getElementById('svg-container');
                container.innerHTML = '';
                container.appendChild(svg);
                console.log("SVG successfully mounted.");

                const svgNS = "http://www.w3.org/2000/svg";

                // Direct Semantic Element Target Resolution
                const hudBox = svg.querySelector('#hud-telemetry-box');
                const generatorCore = svg.querySelector('#center-generator-core');
                const capacitorBox = svg.querySelector('#capacitor-core');
                const coolerBox = svg.querySelector('#coolant-core');
                const lightNodes = Array.from(svg.querySelectorAll('.pylon-emitter-node'));
                const pylonLeft = svg.querySelector('#layer-pylon-left');
                const conduits = Array.from(svg.querySelectorAll('.energy-conduit'));

                console.log(`Resolved semantic nodes -> Core: ${!!generatorCore}, Nodes: ${lightNodes.length}, HUD: ${!!hudBox}, Capacitor: ${!!capacitorBox}, Cooler: ${!!coolerBox}`);

                let textLine1, textLine2;
                if (hudBox) {
                    const hBox = hudBox.getBBox();
                    const padX = hBox.width * 0.08;
                    const padY = hBox.height * 0.15;
                    const fontSize = Math.max(10, Math.min(16, Math.floor(hBox.height * 0.28)));

                    textLine1 = document.createElementNS(svgNS, 'text');
                    textLine1.setAttribute('x', hBox.x + padX);
                    textLine1.setAttribute('y', hBox.y + padY);
                    textLine1.setAttribute('fill', '#ffffff');
                    textLine1.setAttribute('dominant-baseline', 'hanging');
                    textLine1.setAttribute('font-family', 'monospace');
                    textLine1.setAttribute('font-weight', 'bold');
                    textLine1.setAttribute('font-size', `${fontSize}px`);
                    textLine1.textContent = "CORE: STANDBY";

                    textLine2 = document.createElementNS(svgNS, 'text');
                    textLine2.setAttribute('x', hBox.x + padX);
                    textLine2.setAttribute('y', hBox.y + padY + (fontSize * 1.4));
                    textLine2.setAttribute('fill', '#00ffcc');
                    textLine2.setAttribute('dominant-baseline', 'hanging');
                    textLine2.setAttribute('font-family', 'monospace');
                    textLine2.setAttribute('font-size', `${fontSize * 0.85}px`);
                    textLine2.textContent = "SYS_PWR: 0%";

                    svg.appendChild(textLine1);
                    svg.appendChild(textLine2);
                }

                function injectCornerHUD(targetBox, titleText, metricText) {
                    if (!targetBox) return null;
                    const b = targetBox.getBBox();
                    const group = document.createElementNS(svgNS, 'g');
                    
                    const t1 = document.createElementNS(svgNS, 'text');
                    t1.setAttribute('x', b.x + (b.width / 2));
                    t1.setAttribute('y', b.y + (b.height / 2) - 6);
                    t1.setAttribute('fill', '#000000');
                    t1.setAttribute('text-anchor', 'middle');
                    t1.setAttribute('dominant-baseline', 'middle');
                    t1.setAttribute('font-family', 'monospace');
                    t1.setAttribute('font-weight', 'bold');
                    t1.setAttribute('font-size', '12px');
                    t1.textContent = titleText;

                    const t2 = document.createElementNS(svgNS, 'text');
                    t2.setAttribute('x', b.x + (b.width / 2));
                    t2.setAttribute('y', b.y + (b.height / 2) + 10);
                    t2.setAttribute('fill', '#111111');
                    t2.setAttribute('text-anchor', 'middle');
                    t2.setAttribute('dominant-baseline', 'middle');
                    t2.setAttribute('font-family', 'monospace');
                    t2.setAttribute('font-size', '11px');
                    t2.textContent = metricText;

                    group.appendChild(t1);
                    group.appendChild(t2);
                    svg.appendChild(group);
                    return { group, t1, t2 };
                }

                const capHUD = injectCornerHUD(capacitorBox, "CAPACITOR", "0 kV");
                const coolerHUD = injectCornerHUD(coolerBox, "COOLER", "24°C");

                if (generatorCore) {
                    gsap.set(generatorCore, { transformOrigin: "center center", transformBox: "fill-box" });
                }
                if (capacitorBox) {
                    gsap.set(capacitorBox, { transformOrigin: "center center", transformBox: "fill-box" });
                }
                if (coolerBox) {
                    gsap.set(coolerBox, { transformOrigin: "center center", transformBox: "fill-box" });
                }

                // Core Rotation & Breathing Timeline
                const coreTl = gsap.timeline({ paused: true, repeat: -1 });
                if (generatorCore) {
                    coreTl.to(generatorCore, { rotation: "+=360", duration: 6, ease: "none" }, 0)
                          .to(generatorCore, { scale: 1.15, duration: 0.8, yoyo: true, repeat: -1, ease: "sine.inOut" }, 0);
                }

                // Peripheral Units Surge Timeline
                const cornerTl = gsap.timeline({ paused: true, repeat: -1 });
                if (capacitorBox) {
                    cornerTl.to(capacitorBox, { scale: 1.06, duration: 1.2, yoyo: true, repeat: -1, ease: "power1.inOut" }, 0);
                }
                if (coolerBox) {
                    cornerTl.to(coolerBox, { opacity: 0.7, duration: 0.6, yoyo: true, repeat: -1, ease: "sine.inOut" }, 0);
                }

                // Staggered Pylon Light Emitter Sequence
                const nodeTl = gsap.timeline({ paused: true, repeat: -1 });
                if (lightNodes.length > 0) {
                    lightNodes.forEach((node, idx) => {
                        nodeTl.to(node, { fill: "#fff5a8", filter: "url(#cyber-bloom)", opacity: 1, duration: 0.3 }, idx * 0.15)
                              .to(node, { fill: "#decd87", filter: "none", opacity: 0.4, duration: 0.3 }, (idx * 0.15) + 0.3);
                    });
                }

                // Energy Conduits Pulse Timeline
                const conduitTl = gsap.timeline({ paused: true, repeat: -1 });
                if (conduits.length > 0) {
                    conduitTl.to(conduits, { stroke: "#00ffff", opacity: 0.9, strokeWidth: 1.4, duration: 0.8, yoyo: true, repeat: -1, stagger: 0.1 });
                }

                let isRunning = false;
                document.getElementById('btnStart').onclick = () => {
                    if (isRunning) return;
                    console.log("Activating simulation timeline...");
                    isRunning = true;
                    if (textLine1) textLine1.textContent = "CORE: ACTIVE";
                    if (textLine2) textLine2.textContent = "SYS_PWR: 100%";
                    if (capHUD) capHUD.t2.textContent = "750 kV";
                    if (coolerHUD) coolerHUD.t2.textContent = "84°C";
                    coreTl.play();
                    cornerTl.play();
                    nodeTl.play();
                    conduitTl.play();
                };

                document.getElementById('btnStop').onclick = () => {
                    if (!isRunning) return;
                    console.log("Halting simulation timeline...");
                    isRunning = false;
                    if (textLine1) textLine1.textContent = "CORE: STANDBY";
                    if (textLine2) textLine2.textContent = "SYS_PWR: 0%";
                    if (capHUD) capHUD.t2.textContent = "0 kV";
                    if (coolerHUD) coolerHUD.t2.textContent = "24°C";
                    coreTl.pause();
                    cornerTl.pause();
                    nodeTl.pause();
                    conduitTl.pause();
                    gsap.to(lightNodes, { fill: "#decd87", filter: "none", opacity: 0.4, duration: 0.3 });
                    gsap.to(conduits, { stroke: "#ffffff", opacity: 0.4, strokeWidth: 0.8, duration: 0.5 });
                    if (generatorCore) gsap.to(generatorCore, { scale: 1, duration: 0.5 });
                    if (capacitorBox) gsap.to(capacitorBox, { scale: 1, duration: 0.5 });
                    if (coolerBox) gsap.to(coolerBox, { opacity: 1, duration: 0.5 });
                };

                // Dynamic Pylon Addition / Removal
                const dynamicClones = [];
                document.getElementById('btnAdd').onclick = () => {
                    if (!pylonLeft) return;
                    console.log("Cloning pylon layer...");
                    const clone = pylonLeft.cloneNode(true);
                    const step = (dynamicClones.length + 1) * 35;
                    clone.setAttribute('transform', `translate(${step}, 0)`);
                    clone.setAttribute('opacity', '0');
                    svg.appendChild(clone);
                    gsap.to(clone, { opacity: 1, duration: 0.4 });
                    dynamicClones.push(clone);
                };

                document.getElementById('btnRemove').onclick = () => {
                    if (dynamicClones.length === 0) return;
                    console.log("Removing cloned pylon layer...");
                    const target = dynamicClones.pop();
                    gsap.to(target, { opacity: 0, duration: 0.3, onComplete: () => target.remove() });
                };

            } catch (e) {
                console.error("Simulation initialization failed:", e);
            }
        })();
    </script>
</body>
</html>
