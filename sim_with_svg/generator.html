<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theatre.js SVG Generator Workflow</title>
    <style>
        body {
            margin: 0;
            background-color: #030a16;
            color: #eee;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #container {
            width: 380px;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(4, 20, 44, 0.4);
            box-shadow: 0 0 50px rgba(0, 210, 255, 0.2);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
        }
        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }
        #status-bar {
            position: absolute;
            top: 20px;
            font-size: 13px;
            letter-spacing: 1px;
            color: #00d2ff;
            background: rgba(4, 20, 44, 0.8);
            padding: 8px 16px;
            border-radius: 4px;
            border: 1px solid #00d2ff;
        }
    </style>
</head>
<body>

    <div id="status-bar">THEATRE.JS STUDIO ACTIVE - PRESS SPACE TO PLAY/PAUSE</div>
    <div id="container"></div>

    <script type="module">
        import * as core from 'https://cdn.jsdelivr.net/npm/@theatre/core@0.7.2/+esm';
        import studio from 'https://cdn.jsdelivr.net/npm/@theatre/studio@0.7.2/+esm';

        (async function runTheatreWorkflow() {
            try {
                console.log("Initializing Theatre.js ES Modules...");
                studio.initialize();

                const res = await fetch('generator.svg');
                if (!res.ok) throw new Error("Could not load generator.svg: " + res.status);
                const svgText = await res.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(svgText, "image/svg+xml");
                const svg = doc.querySelector('svg');
                
                const container = document.getElementById('container');
                container.appendChild(svg);

                // Target clean semantic elements from generator.svg
                const coreStar = svg.querySelector('#generator-core');
                const bgBox = svg.querySelector('#generator-housing');
                const spark = svg.querySelector('#generator-spark');

                if (coreStar) {
                    coreStar.style.transformOrigin = "center center";
                    coreStar.style.transformBox = "fill-box";
                }
                if (bgBox) {
                    bgBox.style.transformOrigin = "center center";
                    bgBox.style.transformBox = "fill-box";
                }
                if (spark) {
                    spark.style.transformOrigin = "center center";
                    spark.style.transformBox = "fill-box";
                }

                const types = core.types;
                const project = core.getProject('GeneratorSimulation');
                const sheet = project.sheet('CoreAnimationSheet');

                const coreObject = sheet.object('Generator Core', {
                    rotation: types.number(0, { range: [-720, 720] }),
                    scale: types.number(1, { range: [0.5, 2] }),
                    sparkScale: types.number(1, { range: [0.5, 2.5] }),
                    housingPulse: types.number(1, { range: [0.8, 1.4] })
                });

                coreObject.onValuesChange((values) => {
                    if (coreStar) {
                        coreStar.style.transform = `rotate(${values.rotation}deg) scale(${values.scale})`;
                    }
                    if (bgBox) {
                        bgBox.style.transform = `scale(${values.housingPulse})`;
                    }
                    if (spark) {
                        spark.style.transform = `scale(${values.sparkScale})`;
                    }
                });

                await project.ready;
                console.log("Theatre project ready. Sequence running.");
                sheet.sequence.play({ iterationCount: Infinity, range: [0, 4] });

            } catch (err) {
                console.error("Theatre Workflow Initialization Failed:", err);
            }
        })();
    </script>
</body>
</html>
