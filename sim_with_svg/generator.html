<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theatre.js SVG Generator Workflow</title>
    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: #eee;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #container {
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }
        #status-bar {
            position: absolute;
            top: 20px;
            font-size: 14px;
            letter-spacing: 1px;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="status-bar">THEATRE.JS STUDIO ACTIVE - PRESS SPACE TO PLAY/PAUSE</div>
    <div id="container"></div>

    <script type="module">
        import * as core from 'https://cdn.jsdelivr.net/npm/@theatre/core@0.7.2/+esm';
        import studio from 'https://cdn.jsdelivr.net/npm/@theatre/studio@0.7.2/+esm';

        (async function runTheatreWorkflow() {
            try {
                console.log("Initializing Theatre.js ES Modules...");
                studio.initialize();

                const res = await fetch('generator.svg');
                if (!res.ok) throw new Error("Could not load generator.svg: " + res.status);
                const svgText = await res.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(svgText, "image/svg+xml");
                const svg = doc.querySelector('svg');
                
                const container = document.getElementById('container');
                container.appendChild(svg);

                const svgNS = "http://www.w3.org/2000/svg";
                let defs = svg.querySelector('defs');
                if (!defs) {
                    defs = document.createElementNS(svgNS, 'defs');
                    svg.prepend(defs);
                }
                const filter = document.createElementNS(svgNS, 'filter');
                filter.setAttribute('id', 'core-bloom');
                filter.innerHTML = `
                    <feGaussianBlur id="blur-node" stdDeviation="0" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                `;
                defs.appendChild(filter);
                const blurNode = filter.querySelector('#blur-node');

                const paths = Array.from(svg.querySelectorAll('path, rect, polygon'));
                let bgBox = null;
                let coreStar = null;

                paths.forEach(el => {
                    const bbox = el.getBBox();
                    if (bbox.width > 100 && bbox.height > 100 && !coreStar && el.tagName.toLowerCase() === 'path') {
                        coreStar = el;
                    } else {
                        bgBox = el;
                    }
                });

                if (!coreStar && paths.length >= 2) {
                    bgBox = paths[0];
                    coreStar = paths[1];
                } else if (!coreStar && paths.length === 1) {
                    coreStar = paths[0];
                }

                if (coreStar) {
                    coreStar.style.transformOrigin = "50% 50%";
                    coreStar.style.transformBox = "fill-box";
                    coreStar.setAttribute('filter', 'url(#core-bloom)');
                }
                if (bgBox) {
                    bgBox.style.transformOrigin = "50% 50%";
                    bgBox.style.transformBox = "fill-box";
                }

                const types = core.types;
                const project = core.getProject('GeneratorSimulation');
                const sheet = project.sheet('CoreAnimationSheet');

                const coreObject = sheet.object('Generator Core', {
                    rotation: types.number(0, { range: [-720, 720] }),
                    scale: types.number(1, { range: [0.5, 2] }),
                    bloom: types.number(0, { range: [0, 30] }),
                    boxPulse: types.number(1, { range: [0.8, 1.4] })
                });

                coreObject.onValuesChange((values) => {
                    if (coreStar) {
                        coreStar.style.transform = `rotate(${values.rotation}deg) scale(${values.scale})`;
                        blurNode.setAttribute('stdDeviation', values.bloom.toString());
                    }
                    if (bgBox) {
                        bgBox.style.transform = `scale(${values.boxPulse})`;
                    }
                });

                await project.ready;
                console.log("Theatre project ready. Sequence running.");
                sheet.sequence.play({ iterationCount: Infinity, range: [0, 4] });

            } catch (err) {
                console.error("Theatre Workflow Initialization Failed:", err);
            }
        })();
    </script>
</body>
</html>
