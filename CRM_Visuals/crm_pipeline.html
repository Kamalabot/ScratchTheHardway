<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Visual Automation Pipeline - Marketing to Revenue</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 40px;
    }

    /* Top Telemetry Header Bar */
    .telemetry-bar {
      width: 100%;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(0, 243, 255, 0.4);
      padding: 14px 28px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(12px);
      z-index: 100;
    }

    .telemetry-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .telemetry-label {
      font-size: 11px;
      color: #94a3b8;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .telemetry-value {
      font-size: 18px;
      font-weight: bold;
      color: #00f3ff;
      margin-top: 2px;
    }

    /* Main SVG Canvas Wrapper */
    .canvas-wrapper {
      position: relative;
      width: 95vw;
      max-width: 1250px;
      aspect-ratio: 297 / 210;
      margin-top: 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
      border-radius: 12px;
      border: 1px solid rgba(0, 243, 255, 0.25);
      overflow: hidden;
      background: #070b19;
    }

    svg#crm-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Interactive Control Buttons */
    .controls-panel {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      z-index: 10;
      max-width: 1200px;
    }

    .btn-stage {
      background: rgba(15, 23, 42, 0.9);
      padding: 12px 18px;
      font-family: monospace;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-campaign { border: 1px solid #00f3ff; color: #00f3ff; }
    .btn-campaign:hover { background: #00f3ff; color: #070b19; box-shadow: 0 0 16px rgba(0, 243, 255, 0.6); }

    .btn-leads { border: 1px solid #38bdf8; color: #38bdf8; }
    .btn-leads:hover { background: #38bdf8; color: #070b19; box-shadow: 0 0 16px rgba(56, 189, 248, 0.6); }

    .btn-sales { border: 1px solid #a855f7; color: #a855f7; }
    .btn-sales:hover { background: #a855f7; color: #070b19; box-shadow: 0 0 16px rgba(168, 85, 247, 0.6); }

    .btn-invoice { border: 1px solid #f59e0b; color: #f59e0b; }
    .btn-invoice:hover { background: #f59e0b; color: #070b19; box-shadow: 0 0 16px rgba(245, 158, 11, 0.6); }

    .btn-retention { border: 1px solid #22c55e; color: #22c55e; }
    .btn-retention:hover { background: #22c55e; color: #070b19; box-shadow: 0 0 16px rgba(34, 197, 94, 0.6); }

    .btn-auto { 
      border: 1px solid #ffffff; 
      color: #ffffff; 
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.3), rgba(34, 197, 94, 0.3));
    }
    .btn-auto:hover { 
      background: #ffffff; 
      color: #070b19; 
      box-shadow: 0 0 24px rgba(255, 255, 255, 0.9); 
    }
  </style>
</head>
<body>

  <!-- Top Real-time Telemetry Dashboard -->
  <div class="telemetry-bar">
    <div class="telemetry-item">
      <span class="telemetry-label">SYSTEM STATUS</span>
      <span class="telemetry-value" id="val-status">AUTOMATED</span>
    </div>
    <div class="telemetry-item">
      <span class="telemetry-label">CAMPAIGN INGESTION</span>
      <span class="telemetry-value" id="val-campaign" style="color:#00f3ff;">91 Leads/hr</span>
    </div>
    <div class="telemetry-item">
      <span class="telemetry-label">PIPELINE LEADS</span>
      <span class="telemetry-value" id="val-leads" style="color:#38bdf8;">142 Leads</span>
    </div>
    <div class="telemetry-item">
      <span class="telemetry-label">ACTIVE CUSTOMERS</span>
      <span class="telemetry-value" id="val-customers" style="color:#22c55e;">1,280</span>
    </div>
    <div class="telemetry-item">
      <span class="telemetry-label">NET PROFIT</span>
      <span class="telemetry-value" id="val-profit" style="color:#f59e0b;">$142,500</span>
    </div>
    <div class="telemetry-item">
      <span class="telemetry-label">FINAL REVENUE</span>
      <span class="telemetry-value" id="val-revenue" style="color:#00f3ff;">$485,000</span>
    </div>
  </div>

  <!-- SVG Animation Container -->
  <div class="canvas-wrapper" id="svg-host"></div>

  <!-- Action Simulation Controls -->
  <div class="controls-panel">
    <button class="btn-stage btn-campaign" onclick="triggerCampaign()">🚀 1. Run Marketing Campaign</button>
    <button class="btn-stage btn-leads" onclick="triggerLeads()">📥 2. Ingest Leads</button>
    <button class="btn-stage btn-sales" onclick="triggerSales()">📦 3. Sales Attach</button>
    <button class="btn-stage btn-invoice" onclick="triggerInvoice()">💳 4. Settle Invoice</button>
    <button class="btn-stage btn-retention" onclick="triggerRetention()">⭐ 5. Retain Customer &amp; ROI</button>
    <button class="btn-stage btn-auto" onclick="runFullLoop()">⚡ Run Full Marketing → Revenue Loop</button>
  </div>

  <script>
    let svgDoc = null;

    // Load master SVG artwork
    async function loadSVG() {
      try {
        const response = await fetch('lead_to_retention.svg');
        const svgText = await response.text();
        const host = document.getElementById('svg-host');
        host.innerHTML = svgText;
        svgDoc = host.querySelector('svg');
        svgDoc.setAttribute('id', 'crm-canvas');
        console.log("lead_to_retention.svg loaded successfully.");
      } catch (err) {
        console.error("Failed to load SVG:", err);
      }
    }

    // 1. Marketing Campaign Ingestion Trigger
    function triggerCampaign() {
      if (!svgDoc) return;
      const campaignBox = svgDoc.querySelector('#node-campaign-box');
      const conduit = svgDoc.querySelector('#conduit-campaign-leads');
      const leadsElem = document.getElementById('val-leads');
      
      leadsElem.textContent = (parseInt(leadsElem.textContent) + 12) + " Leads";

      gsap.timeline()
        .to(campaignBox, { scale: 1.05, duration: 0.25, yoyo: true, repeat: 1, transformOrigin: "center" })
        .to(conduit, { strokeWidth: 3, stroke: "#00f3ff", duration: 0.4 }, 0.1)
        .to(conduit, { strokeWidth: 1.2, duration: 0.4 });
    }

    // 2. Ingest Leads into Funnel
    function triggerLeads() {
      if (!svgDoc) return;
      const leadsCard = svgDoc.querySelector('#rect1');
      const conduit = svgDoc.querySelector('#conduit-leads-sales');

      gsap.timeline()
        .to(leadsCard, { scale: 1.05, duration: 0.25, yoyo: true, repeat: 1, transformOrigin: "center" })
        .to(conduit, { strokeWidth: 3, stroke: "#38bdf8", duration: 0.4 }, 0.1)
        .to(conduit, { strokeWidth: 1.2, duration: 0.4 });
    }

    // 3. Sales Product Attach
    function triggerSales() {
      if (!svgDoc) return;
      const salesCard = svgDoc.querySelector('#rect1-8');
      const conduit = svgDoc.querySelector('#conduit-sales-invoiced');

      gsap.timeline()
        .to(salesCard, { scale: 1.05, duration: 0.25, yoyo: true, repeat: 1, transformOrigin: "center" })
        .to(conduit, { strokeWidth: 3, stroke: "#a855f7", duration: 0.4 }, 0.1)
        .to(conduit, { strokeWidth: 1.2, duration: 0.4 });
    }

    // 4. Invoiced & Payment Settled
    function triggerInvoice() {
      if (!svgDoc) return;
      const invoiceCard = svgDoc.querySelector('#rect1-8-0');
      const conduit = svgDoc.querySelector('#conduit-invoiced-returning');

      gsap.timeline()
        .to(invoiceCard, { scale: 1.05, duration: 0.25, yoyo: true, repeat: 1, transformOrigin: "center" })
        .to(conduit, { strokeWidth: 3, stroke: "#f59e0b", duration: 0.4 }, 0.1)
        .to(conduit, { strokeWidth: 1.2, duration: 0.4 });
    }

    // 5. Retain Customer & Output Calculations
    function triggerRetention() {
      if (!svgDoc) return;
      const returningCard = svgDoc.querySelector('#rect1-8-0-4');
      const custCard = svgDoc.querySelector('#output-card-customers');
      const profitCard = svgDoc.querySelector('#output-card-profit');
      const revCard = svgDoc.querySelector('#output-card-revenue');

      // Increment values in DOM
      const custElem = document.getElementById('val-customers');
      const profitElem = document.getElementById('val-profit');
      const revElem = document.getElementById('val-revenue');

      custElem.textContent = "1,295";
      profitElem.textContent = "$146,800";
      revElem.textContent = "$498,500";

      // Also update SVG text
      const svgCust = svgDoc.querySelector('#val-output-customers');
      const svgProfit = svgDoc.querySelector('#val-output-profit');
      const svgRev = svgDoc.querySelector('#val-output-revenue');

      if (svgCust) svgCust.textContent = "1.29K";
      if (svgProfit) svgProfit.textContent = "$146.8K";
      if (svgRev) svgRev.textContent = "$498.5K";

      gsap.timeline()
        .to(returningCard, { scale: 1.05, duration: 0.25, yoyo: true, repeat: 1, transformOrigin: "center" })
        .to('#path-feedback-loop', { strokeWidth: 2, opacity: 1, duration: 0.5 }, 0.2)
        .to([custCard, profitCard, revCard], { scale: 1.08, duration: 0.3, yoyo: true, repeat: 1, transformOrigin: "center" }, 0.4)
        .to('#path-feedback-loop', { strokeWidth: 0.7, opacity: 0.4, duration: 0.4 });
    }

    // Full Automation Loop
    function runFullLoop() {
      document.getElementById('val-status').textContent = "RUNNING_CAMPAIGN_LOOP";
      gsap.timeline({
        onComplete: () => {
          document.getElementById('val-status').textContent = "AUTOMATED";
        }
      })
      .add(() => triggerCampaign(), 0)
      .add(() => triggerLeads(), 0.6)
      .add(() => triggerSales(), 1.2)
      .add(() => triggerInvoice(), 1.8)
      .add(() => triggerRetention(), 2.4);
    }

    window.addEventListener('DOMContentLoaded', loadSVG);
  </script>
</body>
</html>
