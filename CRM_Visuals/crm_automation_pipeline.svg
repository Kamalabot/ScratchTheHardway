<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="1200"
   height="700"
   viewBox="0 0 1200 700"
   version="1.1"
   id="svg-crm-pipeline"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">

  <!-- DEFINITIONS: Filters & Gradients -->
  <defs id="defs-crm">
    <!-- Neon Bloom Filters -->
    <filter id="cyan-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="purple-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="amber-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="emerald-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients for Cards & Borders -->
    <linearGradient id="grad-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#070d1e" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="grad-lead-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0088ff" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="grad-product-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="grad-invoice-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="grad-service-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- STANDALONE CSS ANIMATION STYLES -->
  <style id="style-crm">
    .conduit-line {
      stroke-dasharray: 10 6;
      animation: conduit-flow 1.5s linear infinite;
    }

    #radar-sweep {
      transform-box: fill-box;
      transform-origin: center;
      animation: radar-rotate 4s linear infinite;
    }

    .status-badge {
      animation: badge-pulse 2.5s ease-in-out infinite alternate;
    }

    #badge-lead { animation: lead-glow 2s ease-in-out infinite alternate; }
    #badge-product { animation: product-glow 2.2s ease-in-out infinite alternate; }
    #badge-invoice { animation: invoice-glow 1.8s ease-in-out infinite alternate; }
    #badge-service { animation: service-glow 2.4s ease-in-out infinite alternate; }

    .particle-packet {
      animation: particle-pulse 1.2s ease-in-out infinite alternate;
    }

    @keyframes conduit-flow {
      from { stroke-dashoffset: 32; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes radar-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes lead-glow {
      0% { filter: drop-shadow(0 0 2px rgba(0, 243, 255, 0.4)); }
      100% { filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.9)); }
    }

    @keyframes product-glow {
      0% { filter: drop-shadow(0 0 2px rgba(168, 85, 247, 0.4)); }
      100% { filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.9)); }
    }

    @keyframes invoice-glow {
      0% { filter: drop-shadow(0 0 2px rgba(245, 158, 11, 0.4)); }
      100% { filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.9)); }
    }

    @keyframes service-glow {
      0% { filter: drop-shadow(0 0 2px rgba(34, 197, 94, 0.4)); }
      100% { filter: drop-shadow(0 0 10px rgba(34, 197, 94, 0.9)); }
    }

    @keyframes particle-pulse {
      0% { r: 4; opacity: 0.6; }
      100% { r: 7; opacity: 1; filter: url(#cyan-glow); }
    }
  </style>

  <!-- LAYER 1: Background Canvas & Cyber Grid -->
  <g id="layer-background">
    <rect width="1200" height="700" fill="#070b19" />
    
    <!-- Grid Overlay Lines -->
    <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
      <path d="M 0,100 L 1200,100 M 0,200 L 1200,200 M 0,300 L 1200,300 M 0,400 L 1200,400 M 0,500 L 1200,500 M 0,600 L 1200,600" />
      <path d="M 150,0 L 150,700 M 300,0 L 300,700 M 450,0 L 450,700 M 600,0 L 600,700 M 750,0 L 750,700 M 900,0 L 900,700 M 1050,0 L 1050,700" />
    </g>

    <!-- Header Title Banner -->
    <text x="600" y="55" fill="#ffffff" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle" letter-spacing="2">AUTOMATED CRM PIPELINE</text>
    <text x="600" y="80" fill="#94a3b8" font-family="monospace" font-size="13" text-anchor="middle">REAL-TIME LIFECYCLE: INGESTION → ATTACHMENT → INVOICING → AFTER-SERVICE</text>
  </g>

  <!-- LAYER 2: Energy Conduits (Connecting Stages) -->
  <g id="layer-conduits">
    <!-- Stage 1 to Stage 2 Conduit -->
    <path class="conduit-line" id="conduit-1-2" d="M 280,350 L 350,350" stroke="#00f3ff" stroke-width="3" fill="none" opacity="0.8" />
    <!-- Stage 2 to Stage 3 Conduit -->
    <path class="conduit-line" id="conduit-2-3" d="M 570,350 L 640,350" stroke="#a855f7" stroke-width="3" fill="none" opacity="0.8" />
    <!-- Stage 3 to Stage 4 Conduit -->
    <path class="conduit-line" id="conduit-3-4" d="M 860,350 L 930,350" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.8" />
    
    <!-- Service Retention Feedback Loop (Stage 4 back to Stage 1) -->
    <path class="conduit-line" id="conduit-loop" d="M 1040,540 C 1040,640 170,640 170,540" stroke="#22c55e" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="8 6" />
    <text x="600" y="625" fill="#22c55e" font-family="monospace" font-size="11" text-anchor="middle" opacity="0.8">RETENTION &amp; UPSELL AUTOMATION LOOP</text>
  </g>

  <!-- LAYER 3: Stage 1 - Lead Ingestion -->
  <g id="layer-node-lead" transform="translate(50, 140)">
    <rect width="230" height="400" rx="14" fill="url(#grad-card-bg)" stroke="url(#grad-lead-border)" stroke-width="2" />
    
    <!-- Stage Header -->
    <rect x="15" y="15" width="200" height="36" rx="6" fill="rgba(0, 243, 255, 0.1)" stroke="#00f3ff" stroke-width="1" />
    <text x="115" y="38" fill="#00f3ff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">1. LEAD INGESTION</text>
    
    <!-- Radar Widget -->
    <g id="radar-widget" transform="translate(115, 125)">
      <circle r="45" fill="none" stroke="#00f3ff" stroke-width="1" opacity="0.3" />
      <circle r="30" fill="none" stroke="#00f3ff" stroke-width="1" opacity="0.5" />
      <circle r="15" fill="none" stroke="#00f3ff" stroke-width="1" opacity="0.8" />
      <line x1="-45" y1="0" x2="45" y2="0" stroke="#00f3ff" stroke-width="0.5" opacity="0.4" />
      <line x1="0" y1="-45" x2="0" y2="45" stroke="#00f3ff" stroke-width="0.5" opacity="0.4" />
      
      <!-- Rotating Sweep -->
      <line id="radar-sweep" x1="0" y1="0" x2="38" y2="-22" stroke="#00f3ff" stroke-width="2.5" stroke-linecap="round" />
      
      <!-- Target Lead Blip -->
      <circle cx="20" cy="-15" r="4" fill="#00f3ff" id="badge-lead" class="status-badge" />
    </g>

    <!-- Lead Details -->
    <rect x="15" y="195" width="200" height="120" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
    <text x="25" y="220" fill="#e2e8f0" font-family="monospace" font-size="11" font-weight="bold">Acme Global Corp</text>
    <text x="25" y="240" fill="#94a3b8" font-family="monospace" font-size="10">Src: Web Form (Inbound)</text>
    <text x="25" y="260" fill="#94a3b8" font-family="monospace" font-size="10">Intent: High (SaaS)</text>
    
    <!-- Qualification Score Badge -->
    <rect x="25" y="275" width="180" height="26" rx="4" fill="#00f3ff" opacity="0.15" />
    <text x="115" y="292" fill="#00f3ff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">AI SCORE: 98/100 (HOT)</text>
    
    <!-- Action Status Footer -->
    <text x="115" y="365" fill="#00f3ff" font-family="monospace" font-size="11" text-anchor="middle">AUTO-ASSIGNED → SALES</text>
  </g>

  <!-- LAYER 4: Stage 2 - Product Attachment -->
  <g id="layer-node-product" transform="translate(340, 140)">
    <rect width="230" height="400" rx="14" fill="url(#grad-card-bg)" stroke="url(#grad-product-border)" stroke-width="2" />
    
    <!-- Stage Header -->
    <rect x="15" y="15" width="200" height="36" rx="6" fill="rgba(168, 85, 247, 0.1)" stroke="#a855f7" stroke-width="1" />
    <text x="115" y="38" fill="#a855f7" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">2. PRODUCT ATTACH</text>
    
    <!-- Product Catalog Stack -->
    <g transform="translate(15, 70)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="200" height="38" rx="6" fill="rgba(168, 85, 247, 0.08)" stroke="rgba(168, 85, 247, 0.3)" />
      <text x="12" y="24" fill="#e2e8f0" font-family="monospace" font-size="10">✓ Cloud Core Enterprise</text>
      <text x="188" y="24" fill="#a855f7" font-family="monospace" font-size="10" text-anchor="end" font-weight="bold">$18k</text>

      <!-- Item 2 -->
      <rect x="0" y="48" width="200" height="38" rx="6" fill="rgba(168, 85, 247, 0.08)" stroke="rgba(168, 85, 247, 0.3)" />
      <text x="12" y="72" fill="#e2e8f0" font-family="monospace" font-size="10">✓ AI Analytics Suite</text>
      <text x="188" y="72" fill="#a855f7" font-family="monospace" font-size="10" text-anchor="end" font-weight="bold">$4.5k</text>

      <!-- Item 3 -->
      <rect x="0" y="96" width="200" height="38" rx="6" fill="rgba(168, 85, 247, 0.08)" stroke="rgba(168, 85, 247, 0.3)" />
      <text x="12" y="120" fill="#e2e8f0" font-family="monospace" font-size="10">✓ 24/7 VIP Support</text>
      <text x="188" y="120" fill="#a855f7" font-family="monospace" font-size="10" text-anchor="end" font-weight="bold">$2k</text>
    </g>

    <!-- Total Value Summary Card -->
    <rect x="15" y="235" width="200" height="80" rx="8" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1" id="badge-product" class="status-badge" />
    <text x="115" y="260" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">TOTAL ANNUAL VALUE</text>
    <text x="115" y="290" fill="#ffffff" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">$24,500/yr</text>

    <!-- Action Status Footer -->
    <text x="115" y="365" fill="#a855f7" font-family="monospace" font-size="11" text-anchor="middle">DEAL CONFIGURED ✓</text>
  </g>

  <!-- LAYER 5: Stage 3 - Invoice Paid -->
  <g id="layer-node-invoice" transform="translate(630, 140)">
    <rect width="230" height="400" rx="14" fill="url(#grad-card-bg)" stroke="url(#grad-invoice-border)" stroke-width="2" />
    
    <!-- Stage Header -->
    <rect x="15" y="15" width="200" height="36" rx="6" fill="rgba(245, 158, 11, 0.1)" stroke="#f59e0b" stroke-width="1" />
    <text x="115" y="38" fill="#f59e0b" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">3. INVOICE &amp; PAYMENT</text>

    <!-- Invoice Seal / Graphic -->
    <g transform="translate(115, 125)">
      <circle r="40" fill="rgba(245, 158, 11, 0.1)" stroke="#f59e0b" stroke-width="1.5" />
      <path d="M -15,-5 L -3,10 L 18,-12" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <circle r="6" cx="18" cy="-12" fill="#f59e0b" id="badge-invoice" class="status-badge" />
    </g>

    <!-- Invoice Details Card -->
    <rect x="15" y="195" width="200" height="120" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
    <text x="25" y="220" fill="#94a3b8" font-family="monospace" font-size="10">Invoice: #INV-2026-894</text>
    <text x="25" y="240" fill="#94a3b8" font-family="monospace" font-size="10">Gateway: Stripe AutoPay</text>
    
    <!-- Paid Badge -->
    <rect x="25" y="255" width="180" height="45" rx="6" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="1" />
    <text x="115" y="275" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">STATUS: PAID IN FULL</text>
    <text x="115" y="292" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">$24,500.00 SETTLED</text>

    <!-- Action Status Footer -->
    <text x="115" y="365" fill="#f59e0b" font-family="monospace" font-size="11" text-anchor="middle">RECEIPT DISPATCHED</text>
  </g>

  <!-- LAYER 6: Stage 4 - After-Sales Service -->
  <g id="layer-node-service" transform="translate(920, 140)">
    <rect width="230" height="400" rx="14" fill="url(#grad-card-bg)" stroke="url(#grad-service-border)" stroke-width="2" />
    
    <!-- Stage Header -->
    <rect x="15" y="15" width="200" height="36" rx="6" fill="rgba(34, 197, 94, 0.1)" stroke="#22c55e" stroke-width="1" />
    <text x="115" y="38" fill="#22c55e" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">4. AFTER-SERVICE</text>

    <!-- CSAT Health Dial -->
    <g transform="translate(115, 125)">
      <circle r="42" fill="none" stroke="rgba(34, 197, 94, 0.2)" stroke-width="8" />
      <circle r="42" fill="none" stroke="#22c55e" stroke-width="8" stroke-dasharray="210 60" stroke-linecap="round" />
      <text x="0" y="5" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">100%</text>
      <text x="0" y="20" fill="#22c55e" font-family="monospace" font-size="9" text-anchor="middle">CSAT SCORE</text>
      <circle r="5" cx="30" cy="-30" fill="#22c55e" id="badge-service" class="status-badge" />
    </g>

    <!-- Milestone Checklist -->
    <g transform="translate(25, 195)">
      <rect x="0" y="0" width="180" height="26" rx="4" fill="rgba(34, 197, 94, 0.08)" />
      <text x="10" y="17" fill="#e2e8f0" font-family="monospace" font-size="10">✓ Tenant Provisioned</text>

      <rect x="0" y="34" width="180" height="26" rx="4" fill="rgba(34, 197, 94, 0.08)" />
      <text x="10" y="51" fill="#e2e8f0" font-family="monospace" font-size="10">✓ Onboarding Call Done</text>

      <rect x="0" y="68" width="180" height="26" rx="4" fill="rgba(34, 197, 94, 0.08)" />
      <text x="10" y="85" fill="#e2e8f0" font-family="monospace" font-size="10">✓ SLA Monitoring Active</text>
    </g>

    <!-- Action Status Footer -->
    <text x="115" y="365" fill="#22c55e" font-family="monospace" font-size="11" text-anchor="middle">ACCOUNT HEALTH: EXCELLENT</text>
  </g>

  <!-- LAYER 7: Dynamic Energy Packets (Traveling Circles) -->
  <g id="layer-particles">
    <circle cx="315" cy="350" r="5" fill="#00f3ff" class="particle-packet" />
    <circle cx="605" cy="350" r="5" fill="#a855f7" class="particle-packet" />
    <circle cx="895" cy="350" r="5" fill="#f59e0b" class="particle-packet" />
  </g>

</svg>
